<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">퇴사하고싶다</title>
  <desc id="desc">퇴직금 계산기와 사직서 작성 서비스 공유 이미지</desc>

  <!-- 책상(배경) -->
  <rect width="1200" height="630" fill="#E9E7E1"/>

  <!-- 종이 그림자 -->
  <rect x="140" y="72" width="920" height="512" fill="rgba(26,26,26,0.16)"/>
  <!-- 종이 -->
  <rect x="132" y="64" width="920" height="512" fill="#FFFFFF"/>

  <!-- 제목 -->
  <text x="592" y="168" fill="#1A1A1A" font-family="sans-serif" font-size="42" font-weight="700" text-anchor="middle" letter-spacing="22">사 직 서</text>
  <path d="M192 202h800" stroke="#D8D5CC" stroke-width="1.5"/>

  <!-- 워드마크 -->
  <text x="592" y="290" fill="#1A1A1A" font-family="sans-serif" font-size="64" font-weight="700" text-anchor="middle">퇴사하고싶다</text>
  <text x="592" y="332" fill="#545249" font-family="sans-serif" font-size="24" text-anchor="middle">퇴직금 계산기 · 사직서 작성 · 퇴사 감사패</text>

  <!-- 안내 문구 (본문처럼) -->
  <text x="592" y="392" fill="#545249" font-family="sans-serif" font-size="19" text-anchor="middle">입사일과 월급만 입력하면 예상 퇴직금을 간편하게 확인할 수 있습니다.</text>

  <!-- 서명란 -->
  <text x="800" y="472" fill="#545249" font-family="sans-serif" font-size="17" text-anchor="end">신청인</text>
  <text x="822" y="472" fill="#1A1A1A" font-family="sans-serif" font-size="17" font-weight="600" text-anchor="start">○ ○ ○</text>
  <path d="M822 488h95" stroke="#D8D5CC" stroke-width="1"/>

  <!-- 도장 -->
  <g transform="translate(960,470) rotate(-8)">
    <circle r="27" fill="none" stroke="#B5342B" stroke-width="3"/>
    <text y="6" fill="#B5342B" font-family="sans-serif" font-size="15" font-weight="700" text-anchor="middle">印</text>
  </g>
</svg>
